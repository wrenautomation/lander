build:
  id: how
  h2: Four stages. *AI last, on purpose.*
  intro: It starts with a 30-minute call and a written plan. Then one fixed price up front for the build, and a monthly retainer once AI is running.
  week: Week
  weeks: 8
  ongoing: then monthly
  stages:
    - when: Weeks 1–2
      name: Figure out
      from: 1
      to: 2
      text: I watch a normal week with you and a few of your team. Every process gets written down as a plain SOP. Most of them live in one person's head today.
      art:
        kind: rows
        rows:
          - { text: Client intake, note: Written down, mark: ok }
          - { text: Proposals, note: Three versions. One kept, mark: moved }
          - { text: Monday report, note: Only one person knows it, mark: hot }
          - { text: Weekly spreadsheet, note: Nobody reads it, mark: out }
    - when: Weeks 2–4
      name: Fix
      from: 2
      to: 4
      text: We cut the steps that leak hours or clients, biggest first. You sign off on every change, and your team gets one way to do each thing.
      art:
        kind: bars
        bars:
          - { label: Retyping client details, w: 100, hot: true }
          - { label: Chasing meeting times, w: 62 }
          - { label: Building reports, w: 40 }
          - { label: Finding old files, w: 26 }
    - when: Weeks 3–7
      name: Connect
      from: 3
      to: 7
      text: Your inboxes, calendars, spreadsheets and old tools, cleaned into one CRM. Duplicates merged, every client with its full history. The longest stage, because the data is the work.
      art:
        kind: merge
        sources: [Inboxes, Calendars, Spreadsheets, Old CRM]
        into: One clean CRM
    - when: Week 6 on
      name: Put AI to work
      from: 6
      to: null
      text: The first AI job runs on the data already connected, around week 6. Then one new job every month on the retainer, watched and fixed as it runs.
      art:
        kind: rows
        rows:
          - { text: New inquiry, note: Answered in 2 min, mark: hot }
          - { text: Past client, note: Written to. Replied, mark: ok }
          - { text: Signed contract, note: In the CRM. Nobody typed it, mark: ok }
          - { text: Monday report, note: Sent 7:00 am, mark: ok }

