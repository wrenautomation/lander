faq:
  h2: What owners *ask first.*
  items:
    - q: Do we have to change our tools?
      a: No. I build inside what you already use. If a tool is the problem, I'll say so and why.
    - q: What does it cost?
      a: The call and the plan are free. The build is one fixed price, paid up front. Then a monthly retainer once AI is running. You see both before anything starts.
    - q: How long does it take?
      a: About seven weeks to a firm that runs on one clean CRM. The first AI job runs around week 6.
    - q: Why not start with the AI?
      a: AI on messy data makes mistakes faster. Written processes and one clean CRM are what make it work.
    - q: What if something breaks?
      a: If something I built breaks because of my mistake, I fix it free.
    - q: Who do we deal with?
      a: Me. The person who scopes it is the person who builds it.

