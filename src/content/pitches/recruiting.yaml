faq:
  h2: Questions you *should be asking.*
  items:
    - q: We tried re-engaging old clients before. Why would this work?
      a: Before, nobody knew when to reach out. This messages them the day they start hiring.
    - q: What if it doesn't book meetings?
      a: If I don't get you results, you don't pay.
    - q: Who on my team needs to be involved?
      a: You, for one 30-minute call and an export. After that, one person approves messages before they go out.
    - q: Will this hurt our email domain?
      a: No. Emails go from a new domain in your recruiter's name, warmed up and sent in small batches. Your main domain is never touched.

