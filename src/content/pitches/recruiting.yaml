# wrenautomation.com/recruiting/lead-reactivation. The recruiting emails link here. Reader: the owner, CEO or MD
# of a midsize recruiting firm. They care about two things: more business (job orders, a pipeline
# that doesn't hang on one rainmaker) and less busywork for their team.
# The questions on the form and the fit rule come from the offer in wren (packages/offers), not from
# this file. Prices stay off the page.
# title and description: the search result. What someone would type goes first; ~60 and ~155 characters.
title: Lead reactivation for recruiting companies | Wren Automation
description: Win new clients from the past clients already in your ATS, with a personalized lead reactivation system that books the meetings.
path: /recruiting/lead-reactivation
offer: reactivation
form_value: recruiting

nav:
  - { label: How it works, to: "#how" }
  - { label: FAQ, to: "#faq" }
  - { label: About me, to: "#about" }
nav_cta: Win back my clients

hero:
  proof: Built by the engineer behind a Government of Canada system used by 17,000+ staff.
  h1: Book *{until} client meetings in {days} days* from clients you've worked with,
  h1_tail: with my personalized lead reactivation system
  h1_note: (No results? You don't pay.)
  lede: |
    Your past clients are hiring again. Every role they fill through another company is a fee you lose. Don't hand those relationships to a competitor.

    I build you a personalized lead reactivation system that watches every past client for new hiring windows, reaches out in your brand voice, and books the meeting.
  second_to: "#problem"
  promise:
    h: My personal guarantee
    items:
      - If you don't have {until} meetings booked after {days} days, I keep working until you do.
      - I never put your client relationships at risk. Every message is personal and written in your voice.
      - I do the setup and connect your ATS, CRM, inboxes and any other tools you use. All you do is hop on a call for next steps.
  by: If it doesn't fit how your company works, I change the system to fit.

problem:
  id: problem
  questions:
    - Are your recruiters stuck in the **same cold outreach loop** every week?
    - Do clients go quiet after **one hiring season** and never come back?
    - Have you lost a past client to another company because you were **too busy to respond in time?**
  answer: My system catches past clients *the moment they're hiring again,* and books the meeting for you.
  target: My target for you is *{until} booked meetings in {days} days.*
  target_cta: Book a consultation
  cta: I'm ready to win back my clients
  pain:
    - Repeat clients carry most recruiting companies. In Bullhorn's survey, 79% got half or more of their revenue from them.[^1] At a 20% fee, one lost $80,000 role is *$16,000 you don't collect.* Five lost roles is *$80,000,* and ten is *$160,000.*
    - "You win a client and fill the roles. Then the next job order pulls you away. It's not that you don't care. **There's just no time.** So the loop keeps going."
    - Your team spends hours messaging strangers who've never heard of you, and a new client can cost 5 to 25 times more to win than an old one costs to keep.[^2] Meanwhile, the people who **already trust you** go cold.
    - bad:
        - Follow-ups live in someone's head, then get forgotten.
        - Nobody notices when a past client starts hiring again.
        - The CRM reminder fires months late, or never.
        - When a recruiter leaves, **their relationships leave too.**

benefits:
  id: how
  items:
    - flow: watch
      h2: Catch every past client the day they start hiring
      text: My system watches every past client for job posts, funding, new leaders, and contacts who moved to a new company. The day one starts hiring, you know.
      cta: See if my company is a fit
    - flow: reach
      h2: Reach every past client in your brand voice, under your recruiters' names
      text: I write every message, you approve it, and it goes out by email, LinkedIn and text.
    - flow: book
      h2: Walk into warm, booked meetings with the full client history in hand
      text: I sort every reply, handle the back and forth, and put the call on your calendar. Your recruiter only sees the ones ready to talk.
      cta: Start booking meetings

