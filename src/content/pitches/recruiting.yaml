# wrenautomation.com/recruiting. The recruiting emails link here. Reader: the owner, CEO or MD
# of a midsize recruiting firm. They care about two things: more business (job orders, a pipeline
# that doesn't hang on one rainmaker) and less busywork for their team.
# The questions on the form and the fit rule come from the offer in wren (packages/offers), not from
# this file. Prices stay off the page.
title: Wren Automation for recruiting firms
description: Win new clients from the past clients already in your ATS, with a personalized lead reactivation system that books the meetings.
path: /recruiting
offer: recruiting-reactivation-pilot
form_value: recruiting

nav:
  - { label: How it works, to: "#how" }
  - { label: Questions, to: "#faq" }
  - { label: About, to: "#about" }
nav_cta: Win back my clients

hero:
  h1: Win *10 new clients in 90 days* from leads you already paid for, with our personalized lead reactivation system
  lede: |
    Your old clients are hiring again. You built those relationships. Don't hand them to a competitor. We build you a personalized lead reactivation system that watches every past client for new hiring windows, reaches out in your brand voice, and books the meeting. You only pay for meetings that land.
  second_to: "#problem"
  promise:
    h: My personal guarantee
    items:
      - Works with the ATS and inbox you already use.
      - Follows how your firm already works. Nothing new to learn.
      - Every piece of outreach goes out in your brand voice, under your recruiters' names.
  by: If it doesn't fit how your firm works, I change it. Not you.

problem:
  id: problem
  questions:
    - Are your recruiters stuck in the **same cold outreach loop** every week?
    - Do clients go quiet after **one hiring season** and never come back?
    - Have you lost a past client to another firm because you were **too busy to respond in time?**
  answer: Our system catches past clients *the moment they're hiring again,* and books the meeting for you.
  target: Our target for you is *10 new clients in 90 days.* You only pay if you get a clear return on revenue and time saved.
  target_cta: Book a consultation
  cta: I'm ready to win back my clients
  pain:
    - You're not alone. Most mid-size firms work this way.
    - "You win a client and fill the roles. Then the next job order pulls you away. It's not that you don't care. **There's just no time.** So the loop keeps going."
    - Your team spends hours messaging strangers who've never heard of you. Meanwhile, the people who **already trust you** go cold.
    - bad:
        - Follow-ups live in someone's head, then get forgotten.
        - Nobody notices when a past client starts hiring again.
        - The CRM reminder fires months late, or never.
        - When a recruiter leaves, **their relationships leave too.**
    - Every quarter, your past clients open new roles. If you don't reach them first, **another firm will.**

benefits:
  id: how
  cta: I'm ready to win back my clients
  items:
    - flow: watch
      h2: Catch every past client the day they start hiring & never lose another job order to a competitor
      text: Our system watches every past client for job posts, funding, new leaders, and contacts who moved to a new company. The day one starts hiring, you know.
    - flow: reach
      h2: Reach every past client in your brand voice, under your recruiters' names, with zero extra hours from your team
      text: We write every message, you approve it, and it goes out by email, LinkedIn and text. Nothing sends without your OK.
    - flow: book
      h2: Walk into warm, booked meetings with the full client history in hand, no chasing and no guesswork
      text: We sort every reply, handle the back and forth, and put the call on your calendar. Your recruiter only sees the ones ready to talk.

about:
  h2: Hi, I'm *William.*
  paras:
    - I'm a software engineering student at the University of Waterloo, and Wren Automation is the business I'm building.
    - Two of my internships are close to what I'd build for you. At the Government of Canada, I built an AI assistant that lets 17,000+ officers and staff get straight answers from 220+ policy documents.
    - At the University of Alberta, I turned terabytes of experiment files into one database anyone could audit, and automated citation tracking across 7,000+ papers. That cut 200+ hours of manual lookups and saved the lead professor 8+ hours a week. Like you, he was the decision maker, and his time was the scarcest thing in the lab.
    - I build long-term relationships. I want to do such a good job that you'll tell every other business owner you know about me.
  photo: /headshot.png
  sign: William Jin · Toronto
  cta: Get in touch

faq:
  h2: Questions you *should be asking.*
  items:
    - q: We tried re-engaging old clients before. Why would this work?
      a: Before, nobody knew when to reach out. This messages them the day they start hiring.
    - q: What if it doesn't book meetings?
      a: You only pay for meetings that land.
    - q: How much of my team's time does this take?
      a: An export and a 30-minute call. After that, only approvals.
    - q: Will this hurt our email domain?
      a: No. Emails go from a new domain in your recruiter's name, warmed up and sent in small batches. Your main domain is never touched.

ask:
  h2: See if your firm is a fit.
  cta: I'm ready to win back my clients
  assure: No new hires, no new tools, no extra work for your recruiters.
  submit: Send
  sending: Sending…
  name: Your name
  email: Work email
  phone: Phone
  sms_consent: Text me about my request. Up to 4 texts a month. Msg & data rates may apply. Reply STOP to opt out, HELP for help. See [Terms](/terms) and [Privacy](/privacy).
  required: Required
  bad_email: Enter an email I can reply to.
  error: "That didn't send. Email me instead:"
  steps: { next: Next, back: Back, pick_one: Pick one to continue. }
  book_h: You're a fit. *Pick a time.*
  book: Thirty minutes, on video. Nothing to prepare.
  thanks_h: You're a fit. *I'll be in touch.*
  thanks: I'll email you a few times within one business day, from william@wrenautomation.com.
  nofit_h: Thanks. *I've got it.*
  # Says the fit rule in words. Change it with the fit gates in wren's offer.
  nofit: This works best for firms with 5+ recruiters and 500+ past contacts. I'll still read this and reply within a business day.

close:
  h2: You're a 2-minute form away from *getting your week back.*
  reason: Stop wasting time chasing dead ends with cold outreach. *Win back the clients who already trust you.*
  text: Your details and four quick questions, then you pick a time. Nothing to prepare.
  vs:
    win: Firms that start now
    lose: Firms that wait
    rows:
      - [Know the day a past client starts hiring, Find out after another firm fills the role]
      - [Reach every past client with zero extra hours, Keep cold-messaging strangers]
      - ["Walk into warm, booked meetings", Chase replies that never come]
  cta: I'm ready to win back my clients
