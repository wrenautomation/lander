# wrenautomation.com/agencies. Continues the DRAFT 12 agency emails (marketing and build arms): same scene, same words.
# Figures in the prose and where they come from (checked 2026-09-16):
#   70 to 80% utilization is what agencies aim for, so 8 to 12 hours a week per person is non-billable: Runn, utilization benchmarks.
#   85 to 95% realization is called healthy, so 5 to 15% of logged hours never reach an invoice: Bennett Financials, agency benchmarks.
#   94% of audited spreadsheets had at least one error: Panko, "What we know about spreadsheet errors".
#   About 1 in 100 fields typed by hand is wrong: the long-run human-factors figure, also Panko.
hue: red
title: Wren Automation for agencies
h1: Type the **client** in once. Every tool that needs it follows.
lede: |
  Somebody at your shop typed the same client into a fifth tool this week. CRM, board, Friday timesheet, invoice, notes doc.

  Nothing owns the chain between them, so a person is the integration. A new client is five setups, a scope change is five edits, and one of the five stays wrong until the client points it out.

  I build the piece in the middle, **inside the tools you already pay for**. No new platform, no new hire.
# Under the hero button, next to the photo from site.yaml.
who: "**William Jin**, software engineering at Waterloo. Built the policy search 17,000 federal staff use. I write the code myself."
# The hero card: one value typed once, the tools that fill from it. An example, and labelled as one. 2 to 4 docs.
demo:
  label: Typed once
  note: example client
  field: Client, from the CRM
  value: Northwind Co.
  docs: [Board, Timesheet, Invoice, Report]
  foot: "Change it here and all four follow. Nobody retypes it."
cases: [government-of-canada, fuel-cell-group]
# Pick a side. Under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: This is most agencies. It's probably yours.
sides_intro: |
  Agencies aim for 70 to 80% billable and call 85 to 95% realization healthy. So a fifth or more of every week isn't billed, and 5 to 15% of the hours that are logged never reach an invoice.

  That is where the day a week goes. Pick the rows that happen at your shop.
sides_hand: By hand, today
sides_auto: Once it's built
sides:
  - hand: A new client is five setups. The CRM, the board, the timesheet, the invoice, the doc.
    auto: One setup. The other four are created from it.
  - hand: A scope change is five edits. One gets missed until the client points it out.
    auto: One edit. The rest follow, so there is nothing to miss.
  - hand: Month end. Ad accounts into a spreadsheet, fixed by hand, pasted into the deck. One client gets last month's number. 94% of audited spreadsheets have at least one error, and this is a spreadsheet.
    auto: The report builds itself on the first, in your format, from this month's numbers.
  - hand: The invoice comes from a timesheet someone filled in on Friday from memory. The hours don't match the SOW, and someone eats the difference.
    auto: The hours come from the board. The invoice is built from them.
  - hand: The proposal is last quarter's with find and replace, and one old client name survives.
    auto: Built from the scoping call notes. No old names.
  - hand: The zap between the CRM and the board worked, until someone renamed a field. It failed for three weeks before anyone noticed.
    auto: When something breaks, it says so, the same day, to a person.
# Why two builds outside your industry still count. Between the case studies and the list below.
proves_h2: Why two builds outside your industry count
proves_intro: "Neither client is an agency. Both had the same problem you have, at a bigger scale:"
proves:
  - point: Same problem, bigger numbers
    detail: |
      17,000 federal staff found the rule by reading 220 directives by hand. A lab searched 7,000 papers one at a time, 200 hours of someone's time.

      Yours is one client typed into five tools. Smaller, which is why it is a smaller build.
  - point: Still running, without me
    detail: Both are in use today, in the client's own accounts, with no retainer. Yours will be too.
  - point: Nobody learned a system
    detail: Staff type a question. Researchers ask the files. Your team keeps every tool it has, and the typing between them stops.
targets_h2: What gets built first at an agency
targets_intro: The account side, mostly. The jobs that repeat every month and eat billable hours. Bring one to the audit. I have room for a few more this month before I'm heads down on builds.
targets:
  - what: Client onboarding
    how: one intake feeds the CRM, the board, the contract and the kickoff
  - what: Scope changes
    how: one edit, and every tool that carries the scope follows
  - what: Proposals and SOWs
    how: assembled from the scoping call notes
  - what: Monthly client reports
    how: pulled from the ad accounts and analytics, in your deck, on the first
  - what: Hours to invoice
    how: without the Friday timesheet in between
  - what: The unbilled check
    how: which projects logged hours this month and have nothing invoiced, run every week instead of never
  - what: Chasing approvals
    how: the reminder goes out without an account manager remembering
form_value: agencies
