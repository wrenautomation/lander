# wrenautomation.com/agencies. SAMPLE COPY. Rewrite before sending anyone here.
hue: red
title: Wren Automation for agencies
h1: Proposals, monthly reports and onboarding, without rebuilding last month's deck by hand.
lede: "I'm William. I build document and workflow automation for small agencies: proposals, client reporting, onboarding, the handoffs between account and delivery. **Two builds below, with numbers.**"
cases: [government-of-canada, fuel-cell-group]
# Why two builds outside your industry still count. Sits between the case studies and the list below.
proves_h2: What this proves to you
proves_intro: "Neither client is an agency. What carries over:"
proves:
  - point: The shape of the problem is the same
    detail: One client typed into the CRM, the project tool and the deck, and a brief nobody can find. Same shape as 7,000 papers looked up one at a time.
  - point: Still in use
    detail: Both are running today, without me. Nothing was left half done.
  - point: Nobody had to learn a system
    detail: Staff type a question. Researchers ask a question instead of clicking through folders. The work they were already doing got shorter.
targets_h2: What usually gets automated first at an agency
targets_intro: The account side, mostly. The jobs that repeat every month and interrupt billable work.
targets:
  - what: Proposals and SOWs
    how: assembled from the scoping call
  - what: Monthly client reports
    how: pulled from the platforms, in your format, on the first
  - what: Client onboarding
    how: one intake feeds the contract, the brief and the kickoff
  - what: Hours to invoice
    how: without the spreadsheet in between
  - what: Chasing approvals
    how: reminders that go out without an account manager remembering
  - what: Account to delivery handoffs
    how: the message that says "can you add this to the sheet"
