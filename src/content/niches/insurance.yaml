# wrenautomation.com/insurance
hue: green
title: Wren Automation for insurance agencies
h1: Type the **insured** once. Every document that needs it fills itself.
lede: |
  The certificate, the renewal letter, the proposal, the loss run request. Someone at the agency keys the same client into each of them.

  I build the piece in the middle, inside the tools you already use. **A full workday a week back** for each person on your team.
# Under the hero button: who is writing, next to the photo from site.yaml.
who: "**William Jin**, software engineering at Waterloo. I write the code myself."
# The hero card. One value typed once, the documents that fill from it. It is an example and says so in `note`. 2 to 4 docs.
demo:
  label: Entered once
  note: example client
  field: Insured, from the policy
  value: Oak Dental
  docs: [Certificate, Renewal, Proposal, Loss run]
  foot: "Change it once and all four update. The person who used to key it checks the ones that don't match."
cases: [government-of-canada, fuel-cell-group]
# Pick a side. Sits under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: The same work, before and after
sides_intro: A few situations that might apply to you.
sides_hand: Manual work
sides_auto: After we build it
sides:
  - hand: Client details keyed from the policy into the certificate.
    auto: The certificate is issued from the policy data.
  - hand: Renewal letters sent when someone remembers, chased by hand.
    auto: Sent on schedule, tracked, and followed up automatically.
  - hand: A carrier guideline found by asking whoever knows.
    auto: Ask the question, get the passage from the guideline.
  - hand: The proposal assembled from the quote, by hand.
    auto: Assembled from the quote.
# Why two builds outside your industry still count. Sits between the case studies and the list below.
proves_h2: What this proves to you
proves_intro: "Neither client is an insurance agency. What carries over:"
proves:
  - point: The shape of the problem is the same
    detail: A client's details keyed from the policy into the certificate and the renewal summary, and a carrier guideline nobody can find. Same shape as 17,000 people reading 220 directives to find one rule.
  - point: Still in use
    detail: Both are running today, without me. Nothing was left half done.
  - point: Nobody had to learn a system
    detail: Staff type a question. Researchers ask a question instead of clicking through folders. The work they were already doing got shorter.
targets_h2: What usually gets automated first at an agency
targets_intro: The service desk, mostly. The urgent, repetitive jobs that interrupt everything else.
targets:
  - what: Certificate of insurance requests
    how: issued from the policy data in minutes
  - what: Renewal summaries
    how: carrier downloads turned into a client-ready comparison
  - what: Loss run requests
    how: sent, tracked and chased on a schedule
  - what: Proposal packets
    how: assembled from the quote
  - what: Policy change confirmations
    how: drafted from the change, sent for a one-click check
  - what: AMS data cleanup
    how: duplicates and gaps found before renewal season
form_value: insurance
