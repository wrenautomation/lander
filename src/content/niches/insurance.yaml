title: Wren Automation for insurance agencies
h1: Type the **insured** once. Every document that needs it follows.
lede: |
  Someone at your agency keyed the same insured into a fourth document this week. The certificate, the renewal, the proposal, the loss run request.

  Nothing connects them, so a person does. A new account is four setups, an endorsement is four edits, and one of the four stays wrong until the client or the carrier points it out. It gets worse with every account you write.

  I build the connection, **inside the AMS and the tools you already pay for**. No new platform, no new hire.
# Under the hero button, next to the photo from site.yaml.
who: "**William Jin**, software engineering student at Waterloo. Built the policy search 17,000 federal staff use. I write the code myself."
