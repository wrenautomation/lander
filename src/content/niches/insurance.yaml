cases: [government-of-canada, fuel-cell-group]
# Pick a side. Under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: This is most agencies. It's probably yours.
sides_intro: |
  Vertafore asked nearly 2,000 people at independent agencies about their week. Over half said the workload and the stress have gone up, and 85% said a big part of their day is spent in the AMS. The share who would recommend the job fell from 85% to 65% in three years.

  When Vertafore watched 115 service staff work, it found up to 45 minutes a day of steps that could be cut from renewals, new business and endorsements. Rekeying is that kind of step.

  The hours are the smaller cost. The person doing the rekeying is usually your best account manager, and it is the part of the job good people quit over. Vertafore's numbers say so: fewer people would recommend the job every year. A certificate keyed for the tenth time this week is keyed a little worse, by someone who stopped reading closely around the fourth. The hour you spend on it is an hour that didn't go to a renewal call, a referral, or home.
# One line in ink, right above the table.
sides_pick: Pick the rows that happen at your agency.
sides_hand: By hand, today
sides_auto: Once it's built
sides:
  - hand: A certificate request. The insured, the policy numbers, the limits and the holder keyed from the policy into the form, checked, sent.
    auto: Issued from the policy data. The person who used to key it sees only the ones that don't match.
  - hand: Renewal season. The carrier download read line by line, the comparison typed into a spreadsheet, the letter written from it. 94% of audited spreadsheets have at least one error, and this is a spreadsheet.
    auto: The comparison builds itself from the download, in your format, ready before the renewal date.
  - hand: An endorsement. The change keyed into the AMS, the certificate reissued, the confirmation written, the client emailed. One of the four is missed.
    auto: One edit. The certificate, the confirmation and the email follow.
  - hand: The proposal is last year's with find and replace, and one old insured's name survives.
    auto: Built from the quote. No old names.
  - hand: Loss runs requested when someone remembers, chased when the client calls.
    auto: Requested on schedule, tracked, and chased on their own. You see the ones that are late.
  - hand: The download between the carrier and the AMS worked, until a field changed. It failed for three weeks before anyone noticed.
    auto: When something breaks, it says so, the same day, to a person.
# Why two builds outside your industry still count. Between the case studies and the list below.
proves_h2: Why two builds outside your industry count
proves_intro: "Neither client is an insurance agency. Both had the same problem you have, at a bigger scale:"
proves:
  - point: Same problem, bigger numbers
    detail: |
      17,000 federal staff found the rule by reading 220 directives by hand. A lab searched 7,000 papers one at a time, 200 hours of someone's time.

      Yours is one insured keyed into four documents. Smaller, which is why it is a smaller build.
  - point: Still running, without me
    detail: Both are in use today, in the client's own accounts, with no retainer. Yours will be too.
  - point: Nobody learned a system
    detail: Staff type a question. Researchers ask the files. Your team keeps the AMS and every tool it has, and the rekeying between them stops.
targets_h2: What gets built first at an agency
targets_intro: The service desk, mostly. The jobs that repeat every week and interrupt everything else. Bring one to the audit. I have room for a few more this month before I'm heads down on builds.
targets:
  - what: Certificate requests
    how: issued from the policy data, in minutes, without rekeying
  - what: Renewal comparisons
    how: the carrier download turned into a client-ready comparison
  - what: Loss run requests
    how: sent, tracked and chased on a schedule
  - what: Proposal packets
    how: assembled from the quote
  - what: Endorsement confirmations
    how: drafted from the change, sent after a one-click check
  - what: AMS cleanup
    how: duplicates and gaps found before renewal season, not during it
  - what: Carrier guidelines
    how: ask the question, get the passage, instead of asking whoever knows
