# The root page, wrenautomation.com/
hue: rust
title: Wren Automation
kicker: Workflow automation for small firms
h1: Document and workflow automation for firms that still type the same figure five times.
lede: "I'm William. I build the automations small firms never get around to, so each person on the team gets a workday a week back: intake, document generation, the handoffs between people. **Two builds below, with numbers.**"
cases: [government-of-canada, fuel-cell-group]
# Pick a side. Sits under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: Which column is your week?
sides_intro: The same figure ends up in five places because each document was set up on its own, in a different year. Nobody owns the gap between them, so nobody closes it.
sides_hand: By hand
sides_auto: Once built
sides:
  - hand: The same client details typed into the intake, the agreement and the invoice.
    auto: Typed once. The rest read from it.
  - hand: The monthly report rebuilt from last month's, by hand.
    auto: Built the same way each time, ready when it's due.
  - hand: A rule looked up by opening the document and reading.
    auto: Ask the question, get the passage.
  - hand: Reminders that go out when someone remembers.
    auto: Reminders that go out.
# Why two builds outside your industry still count. Sits between the case studies and the list below.
proves_h2: What this proves to you
proves_intro: "Neither client is in your industry. What carries over:"
proves:
  - point: The shape of the problem is the same
    detail: Somebody doing the same lookup by hand, thousands of times, because the answer is buried in documents. Your version has different names on it.
  - point: Still in use
    detail: Both are running today, without me. Nothing was left half done.
  - point: Nobody had to learn a system
    detail: Staff type a question. Researchers ask a question instead of clicking through folders. The work they were already doing got shorter.
targets_h2: What usually gets automated first
targets_intro: The jobs that eat a week are rarely the interesting ones. These come up most.
targets:
  - what: Intake forms that feed everything else
    how: filled once, and everything after reads from it
  - what: Documents generated from one source
    how: letters, agreements, invoices, summaries
  - what: Handoffs between people
    how: the email that says "can you add this to the sheet"
  - what: Weekly and monthly reports
    how: built the same way each time, and ready when they're due
  - what: Chasing
    how: reminders that go out without anyone remembering
  - what: Spreadsheets only one person understands
    how: made boring and shared
form_value: general
