hue: rust
title: Wren Automation for RIAs
h1: Type the **AUM figure** once. Every document that holds it follows.
lede: |
  Your AUM figure lives in four documents, and someone at your firm keeps them in step by hand. Part 1, Part 2A, the compliance manual, the quarterly letter.

  Nothing connects them, so a person does. After every amendment all four have to catch up, and one lags until someone notices two disagree. It gets worse with every account you open.

  I build the connection, inside the tools you already use. **Nothing to do with being more careful, a longer checklist or the compliance platform.**
# Under the hero button, next to the photo from site.yaml.
who: "**William Jin**, software engineering student at Waterloo. Built the policy search 17,000 federal staff use. I write the code myself."
# The hero card: one value typed once, the documents that fill from it. An example, and labelled as one. 2 to 4 docs.
demo:
  label: Typed once
  note: example figure
  field: AUM, from the custodian feed
  value: $84,200,000
  docs: [ADV Part 1, Part 2A, Manual, Q3 letter]
  foot: "Change it here and all four follow. Nobody re-reads the filing to check."
cases: [government-of-canada, fuel-cell-group]
# Pick a side. Under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: This is most RIAs. It's probably yours.
sides_intro: |
  Kitces asked advisors to list their week. They said 43 hours, and the tasks they listed add up to 53: ten hours a week that nobody counts. Only about a fifth of the week is in front of clients. Retyping is that kind of work.

  Schwab's benchmarking study says the top firms spend a quarter less time per client on operations, and they get there with digital workflows.

  The hours are the smaller cost. The person keeping four documents in step is usually your best operations person, and it is the part of the job good people quit over. A figure checked for the fourth time is checked a little worse, by someone who stopped reading closely around the third. The hour you spend on it is an hour that didn't go to a client, a referral, or home.
# One line in ink, right above the table.
sides_pick: Pick the rows that happen at your firm.
sides_hand: By hand, today
sides_auto: Once it's built
sides:
  - hand: The AUM figure typed into Part 1, Part 2A, the manual and the letter, then re-read after every amendment to check.
    auto: Typed once. The other three are written from it.
  - hand: A new client typed into the CRM, the custodian forms, the portfolio system and the planning tool. Same name, address, date of birth and beneficiaries, four times.
    auto: Typed once. The other three are filled from it.
  - hand: The onboarding packet made from the last client's, find and replace, and one old name survives.
    auto: Built from the intake form. No old names.
  - hand: The quarterly pull. Exported from three systems into one spreadsheet, fixed by hand, pasted into the letter the week it's due. 94% of audited spreadsheets have at least one error, and this is a spreadsheet.
    auto: The letter builds itself from this quarter's numbers, ready before it's due.
  - hand: Fee invoices checked against the agreement one at a time, or not at all in a busy quarter.
    auto: Checked on their own, every quarter. You only see the ones that don't match.
  - hand: The nightly CSV between two systems that breaks when two fields disagree, and nobody knows until a client asks.
    auto: When something breaks, it says so, the same day, to a person.
# Why two builds outside your industry still count. Between the case studies and the list below.
proves_h2: Why two builds outside your industry count
proves_intro: "Neither client is an RIA. Both had the same problem you have, at a bigger scale:"
proves:
  - point: Same problem, bigger numbers
    detail: |
      17,000 federal staff found the rule by reading 220 directives by hand. A lab searched 7,000 papers one at a time, 200 hours of someone's time.

      Yours is one figure kept in step across four documents, and one client typed into four systems. Smaller, which is why it is a smaller build.
  - point: Still running, without me
    detail: Both are in use today, in the client's own accounts, with no retainer. Yours will be too.
  - point: Nobody learned a system
    detail: Staff type a question. Researchers ask the files. Your team keeps every tool it has, and the retyping between them stops.
targets_h2: What gets built first at an RIA
targets_intro: Taken from Form ADV filings and from the RIAs I've talked to. Bring one to the audit. I have room for a few more this month before I'm heads down on builds.
targets:
  - what: Client onboarding packets
    how: agreement, IPS and custodian forms from one intake
  - what: Quarterly letters
    how: with the performance figures already in them
  - what: Fee invoices
    how: from custodian data, checked against the agreement
  - what: ADV annual amendment prep
    how: the numbers gathered before the deadline week, and every document that holds them updated together
  - what: Meeting notes into the CRM
    how: and the follow-up tasks that come out of them
  - what: Compliance calendar
    how: reminders and evidence collected as you go
