# wrenautomation.com/ria. Continues the sec_ria emails (documents and operations arms): same scene, same words.
hue: rust
title: Wren Automation for RIAs
h1: Type the **AUM figure** once. Every document that holds it fills in, and nobody re-reads the filing to check.
lede: "Your AUM figure lives in four documents, and someone at your firm keeps them in step by hand. Part 1, Part 2A, the compliance manual, the quarterly letter. After every amendment all four have to catch up, and one of them doesn't until someone notices two disagree. I build the piece in the middle, inside the tools you already use. **Nothing to do with being more careful, a longer checklist or the compliance platform.**"
# Under the hero button, next to the photo from site.yaml.
who: "**William Jin**, software engineering at Waterloo. I built the policy search 17,000 federal staff use, and I write the code myself."
