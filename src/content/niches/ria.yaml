# Pick a side. Under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: The same week, before and after
sides_intro: Pick the ones that happen at your firm. The checklist covers them until a new hire gets complacent, and the compliance platform reminds you what's due without noticing when two documents drift apart.
sides_hand: By hand, today
sides_auto: Once it's built
sides:
  - hand: The AUM figure typed into Part 1, Part 2A, the manual and the letter, then re-read after every amendment to check.
    auto: Typed once. The other three are written from it.
  - hand: A new client typed into the CRM, the custodian forms, the portfolio system and the planning tool. Same name, address, date of birth and beneficiaries, four times.
    auto: Typed once. The other three are filled from it.
  - hand: The onboarding packet made from the last client's, find and replace, and one old name survives.
    auto: Built from the intake form. No old names.
  - hand: The quarterly pull. Exported from three systems into one spreadsheet, fixed by hand, pasted into the letter the week it's due.
    auto: The letter builds itself from this quarter's numbers, ready before it's due.
  - hand: Fee invoices checked against the agreement one at a time.
    auto: Checked on their own. You only see the ones that don't match.
# Why two builds outside your industry still count. Between the case studies and the list below.
proves_h2: Why two builds outside your industry count
proves_intro: "Neither client is an RIA. The problem had the same shape:"
proves:
  - point: Same problem, bigger numbers
    detail: 17,000 federal staff found the rule by reading through 220 directives by hand. A lab searched 7,000 papers one at a time, 200 hours of someone's time. Your version is one figure kept in step across four documents, and one client typed into four systems.
  - point: Still running, without me
    detail: Both are in use today. The department's runs in its own accounts and the lab's stayed with the lab. Yours stays in your accounts too.
  - point: Nobody learned a system
    detail: Staff type a question. Researchers ask the files. Your team keeps the tools it has, and the retyping between them stops.
targets_h2: What gets built first at an RIA
targets_intro: Taken from Form ADV filings and from the RIAs I've talked to. Bring one of these to the audit. I've got room for a few more this month before I'm heads down on builds.
targets:
  - what: Client onboarding packets
    how: agreement, IPS and custodian forms from one intake
  - what: Quarterly letters
    how: with the performance figures already in them
  - what: Fee invoices
    how: from custodian data, checked against the agreement
  - what: ADV annual amendment prep
    how: the numbers gathered before the deadline week, and every document that holds them updated together
  - what: Meeting notes into the CRM
    how: and the follow-up tasks that come out of them
  - what: Compliance calendar
    how: reminders and evidence collected as you go
