# wrenautomation.com/ria
hue: rust
title: Wren Automation for RIAs
h1: Type the **AUM figure** once. Every document that needs it fills itself.
lede: "The ADV, the agreement, the quarterly letter, the fee invoice. Someone at your firm types the same number into each of them. I build the piece in the middle, inside the tools you already use. **A full workday a week back** for each person on your team."
# Under the hero button: who is writing, next to the photo from site.yaml.
who: "**William Jin**, software engineering at Waterloo. I write the code myself."
# The hero card. One value typed once, the documents that fill from it. It is an example and says so in `note`. 2 to 4 docs.
demo:
  label: Entered once
  note: example figure
  field: AUM, from the custodian feed
  value: $84,200,000
  docs: [ADV Part 2, Agreement, Q3 letter, Fee invoice]
  foot: "Change it once and all four update. The person who used to type it checks the ones that don't match."
cases: [government-of-canada, fuel-cell-group]
# Pick a side. Sits under the hero, before the case studies. Left is by hand, right is the same job once built.
sides_h2: The same work, before and after
sides_intro: A few situations that might apply to you.
sides_hand: Manual work
sides_auto: After we build it
sides:
  - hand: The AUM figure typed into the ADV, the agreement, the letter and the invoice.
    auto: Entered once. All four documents pull it from there.
  - hand: The onboarding packet made from the last client's, find and replace.
    auto: Generated from the intake form.
  - hand: Performance numbers pasted into the quarterly letter.
    auto: The letter pulls the numbers in itself.
  - hand: Fee invoices checked against the agreement one at a time.
    auto: Checked automatically. You only see the ones that don't match.
# Why two builds outside your industry still count. Sits between the case studies and the list below.
proves_h2: What this proves to you
proves_intro: "Neither client is an RIA. What carries over:"
proves:
  - point: The shape of the problem is the same
    detail: The same figure looked up and typed four times, because it lives in the ADV, the agreement and the letter. Same shape as 17,000 people reading 220 directives to find one rule.
  - point: Still in use
    detail: Both are running today, without me. Nothing was left half done.
  - point: Nobody had to learn a system
    detail: Staff type a question. Researchers ask a question instead of clicking through folders. The work they were already doing got shorter.
targets_h2: What usually gets automated first at an RIA
targets_intro: Taken from Form ADV filings and from the RIAs I've talked to. Yours will differ, which is what the audit is for.
targets:
  - what: Client onboarding packets
    how: agreement, IPS and custodian forms from one intake
  - what: Quarterly letters
    how: with the performance figures already in it
  - what: Fee invoices
    how: from custodian data, checked against the agreement
  - what: ADV annual amendment prep
    how: the numbers gathered before the deadline week
  - what: Meeting notes into the CRM
    how: and the follow-up tasks that come out of them
  - what: Compliance calendar
    how: reminders and evidence collected as you go
form_value: ria
