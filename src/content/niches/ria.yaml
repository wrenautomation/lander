# wrenautomation.com/ria
hue: rust
title: Wren Automation for RIAs
h1: The same AUM figure lives in your ADV, your agreements, your letters and your invoices. Someone types it four times.
lede: "I'm William. I build document and workflow automation for independent RIAs: onboarding, client documents, quarterly letters, the handoffs in between. **Two builds below, with numbers.**"
cases: [government-of-canada, fuel-cell-group]
# Why two builds outside your industry still count. Sits between the case studies and the list below.
proves_h2: What this proves to you
proves_intro: "Neither client is an RIA. What carries over:"
proves:
  - point: The shape of the problem is the same
    detail: One figure typed into the ADV, the agreement, the letter and the invoice is the same problem as one figure typed into five government documents.
  - point: The build finishes
    detail: Both went live and both are in daily use. The handover is part of the build, so they run without me.
  - point: Nothing changed for the people using it
    detail: They fill the same form and read the same report. The retyping in between is gone.
targets_h2: What usually gets automated first at an RIA
targets_intro: Read from Form ADV filings and from the firms I've talked to. Yours will differ. That is what the audit is for.
targets:
  - what: Client onboarding packets
    how: agreement, IPS and custodian forms from one intake
  - what: Quarterly letters
    how: performance figures pulled in, not pasted
  - what: Fee invoices
    how: from custodian data, checked against the agreement
  - what: ADV annual amendment prep
    how: the numbers gathered before the deadline week
  - what: Meeting notes into the CRM
    how: and the follow-up tasks that come out of them
  - what: Compliance calendar
    how: reminders and evidence collected as you go
form_value: ria
