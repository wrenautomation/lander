# The form. Fields render in this order. `required: true` adds the * and the check; `error` shows under the field when the check fails.
ask_intro: Tell me what eats your week. I reply within one business day with a few times for a 30-minute call. **I send the times myself, and the call commits you to nothing.**
ask_fields:
  - key: name
    label: Name
    placeholder: First name is fine
  - key: email
    label: Work email
    placeholder: you@firm.com
    required: true
    error: Enter a work email so I can reply.
  - key: phone
    label: Phone
    placeholder: "+1"
  - key: note
    label: What eats your week?
    placeholder: The report that takes a day, or the spreadsheet only one person understands.
    required: true
    error: One line is enough.
  - key: questions
    label: Anything you want answered before a call?
    placeholder: Price, timing, who else has to be involved. I answer in the reply.
ask_required: "* required"
ask_submit: Send
ask_small: Lands in my inbox and one table I keep so nothing gets lost. Nobody else sees it, and I delete it if you ask.
ask_error: "That didn't send. Email me instead:"
thanks_h: Got it.
thanks: I'll reply within one business day from william@wrenautomation.com. If it hasn't arrived by then, check spam, then email me directly.

