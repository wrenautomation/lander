# The offer section. Steps first, then the three things you're protected by.
offer_h2: The offer
offer_intro: Three steps. You see each piece working before you pay for it, and you keep everything at the end.
how:
  - name: Audit
    text: "A 30-minute call. I map where the hours go. You get one page back: what to automate first, what it saves, what it costs. Free, and yours to keep if you stop here."
  - name: Build
    text: Scope and milestones agreed up front. I build inside the tools you already use where possible and ship in short cycles, so something useful is running for you early. Each milestone stands on its own, and you see it running before you pay for it.
  - name: Handover
    text: Documentation, a walkthrough for whoever runs it, and the code. It keeps running without a retainer, and I'm reachable if something changes.
# Three principles under the steps.
principles_h3: 3 principles of Wren
principles:
  - name: Accountability
    text: Milestones agreed up front, paid after each one meets your needs. Frequent updates and checkins are done to ensure alignment, and actual ROI is personally guaranteed.
  - name: Scalability
    text: Built to support a whole team of users. When the team grows or a tool changes, the automations maintain usability and are easy to extend.
  - name: Utility
    text: I solve the real problem. If the piece we scoped is not useful or we discover major blockers during development, I'll ensure you still get value from my work.

# Why not the alternatives. Sits between the offer and the questions.
alt_h2: Why not a bigger agency, a consultant, or one more hire?
alt_intro: Each one is a fair option. Here is what each costs you in risk, effort and time.
alt:
  - who: A bigger agency
    text: Their smallest project is bigger than yours, and the retainer runs whether or not anything ships. The person who sold it hands you to a project manager, who hands you to a developer you never meet, and the follow-ups go quiet. Here you pay per milestone, and the person on the call is the person who builds it, checks in and answers the email.
  - who: A consultant
    text: You get a recommendation. You still need someone to build it, and then a second vendor to manage. The audit is the recommendation, free, and the build is the next step with the same person.
  - who: One more hire
    text: Onboarding first, then a person does the typing faster. The typing is still there, done by hand with the errors that come with it, and it grows with the client list. The core problem is untouched. Once the job runs itself, the people you have get their week back, and the work they keep is the work that needs a person.

questions_h2: Questions you probably have
questions_intro: Short answers. Ask me the long ones on the call.
questions:
  - q: I don't know what I'd automate yet. Is it too early to talk?
    a: No. That's what the audit is for. Bring the job that annoys you most and we start there.
  - q: What does it cost?
    a: Quoted after the audit, which is free. You pay per milestone, after each one runs, with nothing hourly and no retainer.
  - q: Where does our client data go?
    a: It stays in your accounts. I build inside them, copy nothing to my own systems, and my access is removed at handover.
  - q: Do we need new software?
    a: Usually not. Most builds run on what you already pay for. If something new is better, I'll say so and you decide.
  - q: We have an IT person, or a compliance consultant. Do they get a say?
    a: Yes. They see everything as it's built, and the documentation is written for them.
  - q: What if it breaks after you leave?
    a: You have the code and the documentation, so anyone technical can fix it. If it's my mistake, I fix it at no charge.

about_h2: About
# The About photo. Remove the line to hide the slot.
