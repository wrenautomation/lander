# The offer section. Steps first, then the three things you're protected by.
offer_h2: The offer
offer_intro: Three steps. You see each piece working before you pay for it, and you keep everything at the end.
how:
  - name: Audit
    text: A 30-minute call. I map where the hours go and tell you what is worth automating and what is not. Free, and useful even if you stop here.
  - name: Build
    text: Scope and milestones agreed up front. I build inside the tools you already use where possible, and you see each milestone running before you pay for it.
  - name: Handover
    text: Documentation, a walkthrough for whoever runs it, and the code. It keeps running without a retainer, and I'm reachable if something changes.
pillars_h3: What you're protected by
# DRAFT. Pillar 1 is decided (pay by milestone). 2 and 3 are first drafts to brainstorm.
pillars:
  - name: You pay by milestone
    text: The build is split into pieces you can see working. You pay for each one after it runs in your accounts, with no deposit and no retainer.
  - name: Built like software, and guaranteed
    text: I'm a software engineer, so it's built the way software is built. Version history, checks on the inputs, and documentation for whoever runs it. If something I built breaks, I fix it at no charge.
  - name: Nothing to unwind
    text: It runs in your accounts, on tools you already pay for, and you keep the code. If you stop working with me, nothing stops working.

questions_h2: Questions you probably have
questions_intro: Short answers. Ask me the long ones on the call.
questions:
  - q: Where does our client data go?
    a: It stays in your accounts. I build inside them, copy nothing to my own systems, and my access is removed at handover.
  - q: What does it cost?
    a: Quoted after the audit, which is free. You pay per milestone, after each one runs, with nothing hourly and no retainer.
  - q: What if it breaks after you leave?
    a: You have the code and the documentation, so anyone technical can fix it. If it's my mistake, I fix it at no charge.
  - q: Do we need new software?
    a: Usually not. Most builds run on what you already pay for. If something new is genuinely better, I'll say so and you decide.

