# The offer section. Steps first, then the three things you're protected by.
offer_h2: The offer
offer_intro: Three steps. You see each piece working before you pay for it, and you keep everything at the end.
how:
  - name: Audit
    text: "A 30-minute call. I map where the hours go. You get one page back: what to automate first, what it saves, what it costs. Free, and yours to keep if you stop here."
  - name: Build
    text: Scope and milestones agreed up front. I build inside the tools you already use where possible, and you see each milestone running before you pay for it.
  - name: Handover
    text: Documentation, a walkthrough for whoever runs it, and the code. It keeps running without a retainer, and I'm reachable if something changes.
# The table under the steps. Left column is what firms usually get; right is the commitment. Row 1 (pay by milestone) is decided; the rest are the pillar drafts in table form.
compare_h3: The usual arrangement, and this one
compare_them: Usually
compare_me: With me
compare:
  - what: How you pay
    them: A deposit, then a retainer.
    me: By milestone, after each one runs in your accounts. No deposit.
  - what: Who does the work
    them: A salesperson, a project manager, and whoever is free that week.
    me: Me, from the call to the handover.
  - what: What you have at the end
    them: A login and a monthly fee.
    me: The code, the documentation, and a walkthrough for whoever runs it.
  - what: If it breaks
    them: A ticket and an hourly rate.
    me: If it's my mistake, I fix it at no charge.
  - what: If you stop
    them: It stops.
    me: It keeps running. It's in your accounts, on tools you already pay for.

questions_h2: Questions you probably have
questions_intro: Short answers. Ask me the long ones on the call.
questions:
  - q: I don't know what I'd automate yet. Is it too early to talk?
    a: No. That's what the audit is for. Bring the job that annoys you most and we start there.
  - q: What does it cost?
    a: Quoted after the audit, which is free. You pay per milestone, after each one runs, with nothing hourly and no retainer.
  - q: Where does our client data go?
    a: It stays in your accounts. I build inside them, copy nothing to my own systems, and my access is removed at handover.
  - q: Do we need new software?
    a: Usually not. Most builds run on what you already pay for. If something new is better, I'll say so and you decide.
  - q: We have an IT person, or a compliance consultant. Do they get a say?
    a: Yes. They see everything as it's built, and the documentation is written for them.
  - q: What if it breaks after you leave?
    a: You have the code and the documentation, so anyone technical can fix it. If it's my mistake, I fix it at no charge.

