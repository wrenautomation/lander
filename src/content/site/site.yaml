about:
  - I'm William. I'm a software engineering student at the University of Waterloo, and Wren Automation is the business I'm building.
  - "My work so far has been internships: data cleaning, pipelines that connect systems, and CRMs. The two builds above came out of that work."
  - I want to get very good at this. The fastest way is to do it for firms that have the problem, and do it well enough that they tell other firms.
why_h3: Why me
why:
  - I'm trained as a software engineer and I write the code myself, so it holds up after the demo. Most agencies hand you something beautifully packaged, with bugs and shortcuts that show up in month three.
  - I'm building a business on this work, and I want every build to be so good you refer me to every owner you know. I'll relax the financial terms to get that result, and I'll say so on the call.

