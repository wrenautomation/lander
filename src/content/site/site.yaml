# The offer section. Steps first, then the three things you're protected by.
offer_h2: The offer
offer_intro: Three steps. You see each piece running before you pay for it, and you keep everything at the end.
how:
  - name: Audit
    text: "A 30-minute call. You share your screen and walk me through one normal week: where the client gets typed, where the report comes from, where the invoice starts. I need no access to anything. I map the chain, count the hours per job, and you get one page back: what to automate first, what it saves a week, what it costs. Free, and yours to keep if you stop here."
  - name: Build
    text: "Scope and milestones in writing before any code. The first milestone is the job with the most hours in it, so something useful is running early. I build inside the tools you already pay for, in your accounts, so your data never leaves them. Every week you get a screen share of what runs now. You pay after each milestone runs. Nothing hourly, no retainer."
  - name: Handover
    text: "Documentation written for whoever runs it, a walkthrough on a call, and the code. My access is removed. It keeps running without me and without a retainer. If it breaks because of something I got wrong, I fix it. If a tool changes on your side, I'm one email away and you decide whether that's a new milestone."
# Three principles under the steps.
principles_h3: 3 principles of Wren
principles:
  - name: Accountability
    text: Milestones agreed up front, paid after each one runs and does what we said. Weekly check-ins, so nothing drifts for a month.
  - name: Scalability
    text: Built for the whole team. When the team grows or a tool changes, the automation keeps working and is easy to extend. You get the code, so nothing depends on me.
  - name: Utility
    text: The build has to be useful, or it doesn't ship. If the piece we scoped turns out not to be, or we hit a blocker, we rescope on the spot and you keep what's already built.

# Why not the alternatives. Sits between the offer and the questions.
alt_h2: Why not a bigger agency, a consultant, or one more hire?
alt_intro: Each is a fair option. Here is what each one costs you.
alt:
  - who: A bigger agency
    text: Their smallest project is bigger than yours, and the retainer runs whether or not anything ships. The person who sold it hands you to a project manager, who hands you to a developer you never meet, and the follow-ups go quiet. Here you pay per milestone, and the person on the call is the person who builds it, checks in and answers the email.
  - who: A consultant
    text: You get a recommendation. You still need someone to build it, and then a second vendor to manage. The audit is the recommendation, free, and the build is the next step with the same person.
  - who: One more hire
    text: Onboarding first, then a person does the typing faster. The typing is still there, by hand, with about one error per hundred fields, and it grows with the client list. The problem is untouched. Once the job runs itself, the people you have get their day back, and the work they keep is the work that needs a person.

questions_h2: Questions you probably have
questions_intro: Short answers. Ask me the long ones on the call.
questions:
  - q: I don't know what I'd automate yet. Is it too early to talk?
    a: No. That's what the audit is for. Bring the job that annoys you most and we start there.
  - q: What does it cost?
    a: Quoted after the audit, which is free, per milestone, in writing. You pay after each milestone runs. Nothing hourly, no retainer.
  - q: Where does our client data go?
    a: It stays in your accounts. I build inside them, copy nothing to my own systems, and my access is removed at handover.
  - q: Do we need new software?
    a: Usually not. Most builds run on what you already pay for. If something new is better, I'll say so and you decide.
  - q: We have an IT person, or a compliance consultant. Do they get a say?
    a: Yes. They see everything as it's built, and the documentation is written for them.
  - q: What if it breaks after you leave?
    a: You have the code and the documentation, so anyone technical can fix it. If it's something I got wrong, I fix it.
  - q: How long does the first build take?
    a: Depends on the job. The one page from the audit has a date on it, and the first milestone is the job with the most hours in it.

