  h2: The bigger you grow, *the worse your profit margin.*
  text: |
    Every new client needs more people. More people need managers, support staff and meetings to stay in sync. Then come the CRMs, subscriptions, consultants, experts and developers to hold it all together. Costs climb faster than revenue, so each new dollar earns less than the one before.[^2]

    **We offer a complete suite of services to align your systems with profitable growth.**
  cta: Keep more of what you earn
