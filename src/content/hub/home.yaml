pain:
  id: pain
  h2: Scaling without a foundation is a *leaky bucket.*
  punch: "You grow, but you end up busier, more stressed and keeping less of what you earn."
  manage:
    h: "As you scale, you end up juggling:"
    items:
      - Managers and support staff
      - CRMs and subscriptions that don't talk to each other
      - Consultants, experts and developers
      - Admin work that eats your week
      - Meetings just to keep everyone in sync
  text: Knowledge workers already spend **58% of their day** on that kind of coordination.[^4] Net margins drop **from 19% under 10 people to 8% past 50.**[^2]
  # the offer in one line; *words* get the highlighter
  fix: "**I'll fix any bottleneck in your business.** You get *your time back* and *more revenue.*"
  cta: Keep more of what you earn
  assure: "Free audit. If it's not a fit, I'll tell you."
  chart:
    h: Net profit margin by team size
    axis: People on the team
    y: Net profit margin
    real: Digital service companies, 2025[^2]
    aim: With the repetitive work automated
    # pct is sourced and printed; aim is our aim, drawn gentler, never printed
    points:
      - { label: Under 10, pct: 19, aim: 19 }
      - { label: 10 to 24, pct: 12, aim: 17.5 }
      - { label: 25 to 49, pct: 9, aim: 16.5 }
      - { label: 50+, pct: 8, aim: 16 }

