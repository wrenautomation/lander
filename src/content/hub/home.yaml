hero:
  proof: Works past the demo. Built by an engineer who's shipped production systems.
  h1: "What if scaling took *less work*, not more?"
  lede: "Scaling usually means more follow-ups, more hires to onboard, more hours to track. We build integrated software that takes that work off your team: lead gen, hiring outreach, onboarding, timesheets, admin, or anything else that slows you down."
  checks:
    - Reduce Busywork by Up to 60%[^1]
    - Fully Managed, Integrated System
    - Better Margins as You Grow
  to_form: Your next stage of growth, without the busywork, is a few steps away.

pain:
  id: pain
  h2: The bigger you grow, *the worse your profit margin.*
  punch: "You're working harder than you need to, and keeping less for it."
  text: Every new client needs more people. More people need managers, support staff and meetings to stay in sync. Then come the CRMs, subscriptions, consultants, experts and developers to hold it all together. Costs climb faster than revenue.[^2]
  # the offer in one line; *words* get the highlighter
  fix: "**We offer a complete suite of services to align your systems with profitable growth.** Bring us *any bottleneck.* We make fixing it as easy as possible."
  cta: Keep more of what you earn
  assure: "Free call. If it's not a fit, I'll tell you."
  chart:
    h: Net profit margin by team size
    axis: People on the team
    y: Net profit margin
    real: Digital service companies, 2025[^2]
    aim: With the repetitive work automated
    # pct is sourced and printed; aim is our aim, drawn gentler, never printed
    points:
      - { label: Under 10, pct: 19, aim: 19 }
      - { label: 10 to 24, pct: 12, aim: 17.5 }
      - { label: 25 to 49, pct: 9, aim: 16.5 }
      - { label: 50+, pct: 8, aim: 16 }

# what makes it stick, right under the pain: six cards, each a place most automation fails and what I do instead.
# No claim here may repeat the comparison, the levels or the FAQ.
values:
  id: why
  h2: Automation that *actually sticks.*
  text: Most companies have paid for software their team stopped using. Here's what I do differently.
  cta: Talk through your bottleneck
  # art: the small animated scene at the top of each card (Values.astro)
  items:
    - { art: handled, name: No extra work for you, text: "I handle the setup, the APIs and the fixes. You tell me the problem in plain words." }
    - { art: messy, name: Built for real-world cases, text: "Bounced emails, duplicate contacts, replies at 2am. I build for the messy parts, because that's where tools break." }
    - { art: charge, name: Built around your team, text: "It fits how your team already works. You choose what runs on its own and what waits for a yes." }
    - { art: watched, name: Nothing runs unwatched, text: "Every run is logged. A failure gets caught and fixed, not found by a client weeks later." }
    - { art: cost, name: You see what it costs, text: "Each job shows what it costs to run. No guessing what you pay for." }
    - { art: first, name: Start where it pays most, text: "The first job is the one that frees the most hours. Everything after builds on it." }

levels:
  id: levels
  h2: Most companies *start at level four.*
  text: "88% of companies now use AI somewhere, yet nearly two-thirds haven't started scaling it.[^3] AI can't run on scattered data and processes nobody wrote down. Each level holds up the one above it."
  cta: Find my level
  how: "Walk me through a normal week. I'll tell you your level."
  word: Level
  most: 4
  most_note: Most jump in here
  fall: Nothing under it
  gate: { after: 3, name: AI-ready }
  # scene: the icons drawn inside the bar; linked joins them with a line (the tools talk to each other).
  # is: what the level looks like, so the reader spots their own. why: what it costs you (the top level: the good
  # news). fix: my bubble. One sentence each.
  items:
    - name: Manual
      scene: [person, person, person]
      is: "Work lives in people's heads."
      why: "You're everyone's backup. Someone's out and deadlines slip."
      fix: "I write down how your team actually works, so anyone can do it."
    - name: Documented
      scene: [doc, mail, stack]
      is: "It's written down, but your data sits in every tool."
      why: Nobody trusts the numbers, and leads slip between tools.
      fix: "I merge it all into one clean CRM and cut the tools you don't need."
    - name: Connected
      scene: [doc, mail, stack]
      linked: true
      is: One clean record. Handoffs run on their own.
      why: Your team still researches and writes it all. Growth means hiring.
      fix: "I put AI on the busywork: lead research, drafts, call notes."
    - name: AI-assisted
      scene: [spark, doc, person]
      linked: true
      is: AI drafts. Your team checks every piece.
      why: Your best people become editors. Headcount still climbs with volume.
      fix: "I track what you approve unchanged and let it run on its own."
    - name: Self-running
      scene: [spark, loop, check]
      linked: true
      is: The daily work runs itself. Your team handles clients.
      why: "More clients, same team. No new hire for every new client."
      fix: "I monitor your automations and fix any issues that come up."

