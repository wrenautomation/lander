faq:
  h2: Questions you *should be asking.*
  items:
    - q: Which system should we start with?
      a: The one closest to revenue. For most firms that's new inquiries waiting too long or past clients going cold. On the call I'll tell you which.
    - q: Do we have to change our tools?
      a: No. I build inside what you already use. If a tool is the problem, I'll say so and why.
    - q: Why not start with the AI?
      a: AI on messy data makes mistakes faster. Written processes and one clean CRM are what make it work.
    - q: How long does it take?
      a: About seven weeks to a firm that runs on one clean CRM. The first AI job runs around week 6.
    - q: Who on my team needs to be involved?
      a: You for an hour, then 45 minutes with three or four of your team. After that, a 20-minute check-in each week.
    - q: What happens after the build?
      a: I watch it run and fix what breaks. Then one new AI job a month, if you want it.

