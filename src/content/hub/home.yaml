  h2: The bigger you grow, *the less you keep.*
  text: |
    More clients bring more repetitive work: follow-ups, data entry, reports. It already takes 58% of your team's day.[^2] So every new client needs another hire, and payroll grows as fast as revenue.

    That's why margins shrink as companies grow.

    **Take the repetitive work off your team, and more of every new dollar stays yours.**
  cta: Keep more of what you earn
  chart:
    h: Net profit margin by team size
    axis: People on the team
    note: Digital service companies, 2025.[^3]
    aim: With the repetitive work automated
    bars:
      - { label: Under 10, pct: 19 }
      - { label: 10 to 24, pct: 12 }
      - { label: 25 to 49, pct: 9 }
      - { label: 50+, pct: 8 }

