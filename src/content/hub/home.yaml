# wrenautomation.com/. The hub: Wren as a whole, for anyone who lands without a service link.
# Reader: an owner or executive at a company of 10+ people. The pitch: one connected system, built on their
# tools, for every part of the company that has to scale (lead gen, hiring outreach, admin, timesheets,
# onboarding), with AI on the research and the repetitive work. Money first: grow without margins shrinking,
# because the repetitive work no longer needs a new hire for every new client. Call the reader a company, never an agency.
# The page also teaches the market: where the week goes, why AI stalls, why speed to lead matters.
# Rules: prices off the page. Proof is real only (the Government of Canada and University of Alberta builds).
# No client cases until there are real ones. Every outside figure carries a [^n] marker to `sources` at the end.
# Notes on how they're used:
#   The hero's "up to 60%" takes the low end of McKinsey's 60 to 70%, as a ceiling, not a measured result.
#   The pain chart is Promethean's net margin after tax by headcount (0-9, 10-24, 25-49, 50+ FTE). Their sample is
#     digital agencies, so the note names them; the copy stays general. The aim line is our aim, not data: no number.
#   58% is Asana 2022's work about work.
# Team time, weeks and the retainer's monthly AI job come from the offer in wren (packages/offers).
