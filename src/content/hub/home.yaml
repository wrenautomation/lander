# wrenautomation.com/. The hub: Wren as a whole, for anyone who lands without a service link.
# Reader: an owner or executive at a company of 10+ people. The pitch: one connected system, built on their
# tools, for every part of the company that has to scale (lead gen, hiring outreach, admin, timesheets,
# onboarding), with AI on the research and the repetitive work. Grow without the headcount growing with it.
# The page also teaches the market: where the week goes, why AI stalls, why speed to lead matters.
# Rules: prices off the page. Proof is real only (the Government of Canada and University of Alberta builds).
# No client cases until there are real ones. Every figure below is sourced:
#   58% of the day on work about work, 4.9 hours a week saved by better processes: Asana, Anatomy of Work
#     Global Index 2023 (9,615 knowledge workers).
#   58 / 33 / 9 split of work about work, skilled and strategic work (the pain chart): Asana, Anatomy of Work
#     Global Index 2022.
#   About 70% of a sales rep's time on non-selling tasks: Salesforce, State of Sales, 6th edition.
#   Nearly 7x more likely to qualify a lead contacted within an hour: Harvard Business Review, "The Short Life
#     of Online Sales Leads", March 2011 (2,241 companies).
#   Work that absorbs 60 to 70% of employees' time could be automated (the hero's "up to 60%" check
#     takes the low end, as a ceiling, not a measured result): McKinsey, "The economic potential of
#     generative AI", June 2023.
#   88% use AI in at least one function, nearly two-thirds not yet scaling it, 39% report any EBIT impact:
#     McKinsey, "The state of AI in 2025", November 2025.
# Team time, weeks and the retainer's monthly AI job come from the offer in wren (packages/offers).
