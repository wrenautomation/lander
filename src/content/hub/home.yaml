faq:
  h2: Questions you *should be asking.*
  items:
    - q: How much of our work could software do?
      a: McKinsey estimates today's AI and automation could handle work that takes up 60 to 70% of employees' time.[^1] Not whole jobs. The repetitive parts of every job.
    - q: We already pay for AI tools. Why isn't it paying off?
      a: Only 39% of companies see any effect on profit from AI so far.[^3] It pays once your data sits in one place and your work runs on it. That's why the build starts there.
    - q: Will this replace my team?
      a: It replaces the copy and paste, not the people. Your team keeps the calls, the relationships and the judgment. In Asana's survey, workers said better processes alone would give them back 4.9 hours a week.[^4]
    - q: What if our processes aren't written down?
      a: Then that's where the audit starts. Automating a broken process just breaks it faster. So I fix the process first, then automate it.
    - q: Which part should we automate first?
      a: "Look for work that repeats, follows the same steps every time and eats hours: moving data between tools, follow-ups, scheduling, reports."
    - q: How much of my team's time does this take?
      a: An hour with you and 45 minutes each with three or four of your people in the first two weeks. After that, a 20-minute check-in each week.
    - q: What do I get from the free audit?
      a: "On one call, I map where your team's hours go, find your biggest bottleneck and tell you what to fix first. You keep the plan, whether or not you hire me."
    - q: What happens after launch?
      a: I stay on. I keep what I built tuned as you grow and add one new AI job every month. If something I built breaks by my mistake, I fix it free.

