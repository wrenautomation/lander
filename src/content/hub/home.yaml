# wrenautomation.com/. The hub: Wren as a whole, for anyone who lands without a service link.
# Laid out on the B2B landing template: hero with the form, proof, the pain, proof, three benefits, proof,
# a comparison, how it works, FAQ, the recap. Every section ends on one button to the form.
# Reader: C-suite and key decision-makers at mid to big companies (brief 2026-09-29). Copy is placeholder
# until William writes it: each [bracket] says what goes there.
# Was: an owner or executive of a service firm. Prices stay off the page. Proof is real only:
# the Government of Canada and University of Alberta builds, and William himself.
title: Wren Automation
description: Wren connects your company's tools into one clean system, then puts AI to work on it. More clients in, less busywork out.
path: /
offer: ops-automation-build
form_value: general

