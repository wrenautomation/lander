# One case study. `story` is what the team does and where the hours went; `now` is the same week today.
# `you: true` marks a step a person does (filled node).
# PLACEHOLDER FIGURES. Replace with the real client, numbers and steps before this goes live.
client: Government of Canada
kind: Document pipeline · 2025
story: A four-person team in a federal department produces the same set of five documents for every request that comes in. Each one carried the same names, dates and reference numbers, typed by hand from a shared spreadsheet into a template that broke whenever someone renamed a column. Six to seven hours a week went to retyping and to the emails asking which copy was right.
now: Someone fills one form. Six minutes later five documents are in the shared drive, named and formatted. If a detail changes, they edit the sheet and only the affected documents re-render. Nobody opens a template.
pipe_lead: Two human steps, submit and send. Everything between them runs itself.
steps:
  - name: Fill one form
    you: true
    text: Required fields are enforced at entry. The shared spreadsheet is gone.
  - name: Store
    text: One source-of-truth sheet, version history on every edit.
  - name: Render
    text: Five templates fill from the sheet on submit, in the department's own format.
  - name: Catch edits
    text: A scheduled job spots later changes and re-renders only what changed.
  - name: Send
    you: true
    text: Five documents, named and filed in the shared drive.
# fig is what is shown. count makes it count up to that number on scroll (suffix is appended); leave count out for text figures.
impact:
  - fig: 6 to 7 hrs
    label: a week returned to a four-person team
  - fig: 6 min
    count: 6
    suffix: " min"
    label: per document set, down from about two hours
  - fig: "0"
    count: 0
    label: retyping. Every document comes from the one sheet
stack: Python, Google Workspace, one scheduled job. Handed over with documentation and a walkthrough.
