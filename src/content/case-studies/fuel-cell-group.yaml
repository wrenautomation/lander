# Business facts only; the technical detail is on the résumé.
client: University of Alberta
kind: Research lab · 2025
result: Automated citation tracking for 7,000 papers and the search through 5,000 experiment files.
story: |
  A research lab needed to know who was citing 7,000 papers, and where. Each one was a search by hand, about two minutes a paper, so 200 hours of someone's time.

  The lab's own experiment files, 5,000 of them, sat on one computer and were found by clicking through folders.
now: |
  The lookups run on their own, and what comes out is a map of who cites what, by region, that the lab uses in its talks.

  The experiment files are in one place, and a researcher can ask in plain words: what did this run show, how does today compare with last week. Still in use today.
pipe_lead: A person at each end. Everything between the folder and the answer runs itself.
steps:
  - name: Hand over
    you: true
    text: The list of 7,000 papers and the folder of experiment files. That is the whole input.
  - name: Look up
    text: Every paper is looked up and every citing author pulled, the way a person would, without the person.
  - name: Load
    text: The citations and the 5,000 experiment files go into one place.
  - name: Map
    text: Who cites what, drawn by region.
  - name: Ask
    you: true
    text: Put the map in the talk. Ask the files a question in plain words and get the answer.
impact:
  - fig: 200 hrs
    count: 200
    suffix: " hrs"
    label: of someone's time, at about two minutes a paper
  - fig: 7,000
    count: 7000
    label: papers tracked without anyone searching
  - fig: 5,000
    count: 5000
    label: experiment files that answer a question in plain words
stack: Built at the lab, left with the lab. Still in use today.
